<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Poster Downloader (TMDB)</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

<h1>Poster Downloader (TMDB)</h1>

<div class="top-bar">
    <div class="search-container">
        <input id="search" type="text" placeholder="Buscar película..." autocomplete="off">
        <div id="suggestions" class="suggestions"></div>
    </div>

    <div class="filters">
        <label for="quality-filter">Filtros:</label>
        <select id="quality-filter">
            <option value="all">Mostrar todas</option>
            <option value="excellent">Excelente (≥ 3000 px)</option>
            <option value="acceptable">Aceptable (2500–2999 px)</option>
            <option value="poor">No recomendado (< 2500 px)</option>
        </select>
    </div>

    <button id="sort-btn">Ordenar por resolución</button>
</div>

<h2 id="selected-title"></h2>
<div id="posters" class="posters"></div>

<!-- IMPORTANTE -->
<script src="./script.js"></script>

</body>
</html>
