<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poster Downloader - TMDB</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 Poster Downloader</h1>
            <p class="subtitle">Descubre y descarga posters de películas en alta calidad</p>
        </header>

        <div class="search-section">
            <div class="search-container">
                <input id="search" type="text" placeholder="Buscar película... (ej: Batman, Inception, Avatar)" autocomplete="off">
                <div id="suggestions" class="suggestions"></div>
            </div>

            <div class="controls">
                <div class="filter-group">
                    <label for="quality-filter">Calidad:</label>
                    <select id="quality-filter">
                        <option value="all">Todas las resoluciones</option>
                        <option value="excellent">Excelente (≥ 3000 px)</option>
                        <option value="acceptable">Aceptable (2500–2999 px)</option>
                        <option value="poor">Baja (< 2500 px)</option>
                    </select>
                </div>
                <button id="sort-btn" class="sort-btn">
                    ↕ Ordenar por resolución
                </button>
            </div>
        </div>

        <h2 id="selected-title"></h2>

        <div id="posters" class="posters"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
